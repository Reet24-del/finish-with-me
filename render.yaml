services:
  - type: web
    name: finish-with-me
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: HOSTED_DEMO
        value: "true"
      - key: DATA_DIR
        value: /tmp/finish-with-me-demo
