services:
  iris-volume-init:
    image: ${IRIS_IMAGE:-iris-community:2027.1.0AI.109.0}
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 51773:51773 /durable"]
    volumes:
      - iris-data:/durable
  iris:
    image: ${IRIS_IMAGE:-iris-community:2027.1.0AI.109.0}
    restart: unless-stopped
    depends_on:
      iris-volume-init:
        condition: service_completed_successfully
    environment:
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
      ISC_DATA_DIRECTORY: /durable
      AIHUB_PROVIDER: ${AIHUB_PROVIDER:-groq}
      AIHUB_MODEL: ${AIHUB_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FINISH_GATE_FILE: /durable/finish/gate_engine.py
    ports:
      - "127.0.0.1:52773:52773"
      - "127.0.0.1:1972:1972"
    volumes:
      - iris-data:/durable
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - iris
    environment:
      PORT: 4318
      DATA_DIR: /app-data
      IRIS_BASE_URL: http://iris:52773/csp/user/finish/
      IRIS_USERNAME: ${IRIS_USERNAME:-_SYSTEM}
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - app-data:/app-data
volumes:
  iris-data:
  app-data:
