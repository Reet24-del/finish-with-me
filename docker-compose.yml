services:
  iris:
    image: ${IRIS_IMAGE:-iris-community:2027.1.0AI.109.0}
    restart: unless-stopped
    environment:
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
      AIHUB_PROVIDER: ${AIHUB_PROVIDER:-groq}
      AIHUB_MODEL: ${AIHUB_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "52773:52773"
      - "1972:1972"
    volumes:
      - ./iris/src:/iris/src:ro
      - iris-data:/durable
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - iris
    environment:
      PORT: 4318
      DATA_DIR: /app-data
      IRIS_BASE_URL: http://iris:52773/csp/user/finish/
      IRIS_USERNAME: ${IRIS_USERNAME:-_SYSTEM}
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
    ports:
      - "4318:4318"
    volumes:
      - app-data:/app-data
volumes:
  iris-data:
  app-data:
